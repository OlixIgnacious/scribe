name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # Pins the interpreter the matrix asks for; without this, `uv pip
      # install --system` would silently use the runner's default Python
      # and every matrix leg would test the same version.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install
        run: uv pip install --system -e ".[api,dev]"

      - name: Show environment
        run: |
          python --version
          ffmpeg -version | head -1

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
